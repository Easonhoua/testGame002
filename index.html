    <script>
      window.deferredPrompt = null
      window.RegisterPwaStatus = 0
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js').then(registration => {
            window.RegisterPwaStatus = 1
            console.log('ServiceWorker registration successful with scope: ', registration.scope);
          }, err => {
            window.RegisterPwaStatus = 2
            console.log('ServiceWorker registration failed: ', err);
          });
        });
      }else{
        console.log('当前浏览器不支持PWA');
      }
    </script>

    <script>
      var fullUrl = window.location.href;
      var fullUrls = fullUrl.split('?');
      window.allParams = fullUrls[1];
      window.google_key = ''
      window.kwaiqKey = '';
      window.fbqKey = '';
      window.ttqKey = '';
      window.bigoKey = '';
      window.gtagId = '';
      window.pa = '';
      window.ch = '';
      let tempCH = '';
      let sdmode = '';

      if (fullUrls.length >= 2) {
        let params = fullUrls[1].split('&');
        for (var i = 0; i < params.length; i++) {
          var items = params[i].split('=');
          if (items.length == 2) {
            if (items[0]=='kwaiId') {
              window.kwaiqKey = items[1];
            } else if (items[0]=='fbPixelId') {
              window.fbqKey = items[1];
              // alert(window.fbqKey)
            } else if (items[0]=='ttPixelId') {
              window.ttqKey = items[1];
            } else if (items[0]=='ch') {
              tempCH = items[1];
              window.ch = items[1];
            } else if (items[0]=='sdmode') {
              sdmode = items[1];
            } else if (items[0]=='bgPixel') {
              window.bigoKey = items[1];
            } else if (items[0]=='gtagId') {
              window.gtagId = items[1];
            } else  if (items[0]=='pa') {
              window.pa = items[1];
            } 
          }
        }
      }
      let domain = window.location.protocol + '//' + window.location.host + '/';
      let url = window.location.href;
      let down_link = window.location.href;
      let dn = '20069';
      let name = 'TextName';
      let short_name = 'Text';
      if (url.indexOf("?") != -1) {
          let urls = url.split('?');
          if (urls.length >= 2) {
              url = domain + 'index.html#/';
              down_link = domain + 'index.html#/';
              for (let i = 1;i < urls.length;i++) {
                let temp = urls[i];
                temp = temp.replace('#/','');
                if (i == 1) {
                    url = url + '?' + temp;
                    down_link = down_link + '?' + temp;
                } else {
                    url = url + '&' + temp;
                    down_link = down_link + '&' + temp;
                }
              }
              
              url = url.replace(new RegExp('([?&])' + 'sdmode' + '=[^&]*(&|$)', 'g'), '$1');
              url = url.replace(/[&]$/, '');

              if (url.indexOf('sdmode=2') == -1) {
                url = url + '&sdmode=2'
              }
              
              down_link = down_link.replace(new RegExp('([?&])' + 'sdmode' + '=[^&]*(&|$)', 'g'), '$1');
              down_link = down_link.replace(/[&]$/, '');

              if (down_link.indexOf('sdmode=4') == -1) {
                down_link = down_link + '&sdmode=4'
              }

          } else {
            url = domain + 'index.html#/' + '?' + 'sdmode=2';
            down_link = domain + 'index.html#/' + '?' + 'sdmode=4';
          }
      } else {
          url = domain + 'index.html#/' + '?' + 'sdmode=2';
          down_link = domain + 'index.html#/' + '?' + 'sdmode=4';
      }
      window.pwaurl = url;
      window.downurl = down_link;
      domain = window.location.protocol + '//' + window.location.host;
      window.isFBJumpNormal = 1;
      let info = JSON.parse(localStorage.getItem('authInfo'))
      let isAppleDevice = /Mac|iPhone|iPad|iPod/.test(navigator.userAgent);
      window.manifestURL = '/api/index/manifest';
      window.manifestP = {
        // dn: dn,
        ch: tempCH,
        // name: name,
        // short_name: short_name,
        tk: info && info.access_token ? info.access_token : '',
        domain: domain,
        start_url: url,
        pa:window.pa,
        // fbPixelId:window.fbqKey,
      };
      // if (!isAppleDevice) {
          const queryString = new URLSearchParams(window.manifestP).toString();
          let manifestHref = window.manifestURL+'?'+queryString;
          document.querySelector('#my-manifest').setAttribute('href', manifestHref);
      // }
      console.log('url', url);
    </script>

    <script>
      let queryIndex = location.href.indexOf('?')
      let hashIndex = location.href.indexOf('#')
      if(queryIndex < hashIndex){
          location.href = location.origin + location.pathname + location.hash + location.search
      }else if(hashIndex == -1) {
        let hash = location.hash?location.hash:'#/'
        location.href = location.origin + location.pathname + hash + location.search
      }
    </script>
